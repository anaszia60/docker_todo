version: '3.8'

services:
  # Frontend - Todo App UI
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: todoapp-frontend
    ports:
      - "8000:80"
    networks:
      - todoapp-network
    restart: unless-stopped

  # Backend - API Service (optional, for future expansion)
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: todoapp-backend
    ports:
      - "3000:3000"
    networks:
      - todoapp-network
    environment:
      - NODE_ENV=production
      - PORT=3000
    restart: unless-stopped

networks:
  todoapp-network:
    driver: bridge

